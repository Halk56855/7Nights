name: Build 7Nights ROM

on:
  workflow_dispatch:
    inputs:
      build_zip:
        description: 'Create flashable ROM ZIP archive'
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [a04]

    steps:
      # 1. جلب الكود الأساسي للمستودع
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. تحديث رابط الـ Submodule إلى مستودعك الخاص ومزامنته
      - name: Initialize submodules with custom repository URL
        run: |
          git config --global url."https://".insteadOf git://
          git config submodule.target/a53x/patches/vendor.url https://github.com/Halk56855/unica_target_a53x_patches_variants.git
          git config submodule.target/a53x/patches/vendor.branch sixteen
          git submodule sync
          git submodule update --init --recursive --remote

      # 3. تفريغ مساحة القرص الصلب
      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      # 4. تهيئة بيئة البناء
      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            p7zip-full jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler pcre2-utils webp \
            curl xxd patchelf flex bison libarchive-tools build-essential python3.12-venv device-tree-compiler
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          mkdir -p security
          if [ -n "${{ secrets.PLATFORM_KEY_PK8 }}" ]; then
            echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/platform.pk8
            echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/platform.x509.pem
          fi

      # 5. تثبيت JDK 11
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'

      # 6. بناء التبعيات واستخراج الفيرموير
      - name: Build dependencies
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Download source firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/download_fw.sh --ignore-target

      - name: Extract source firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh --ignore-source

      - name: Download target firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/download_fw.sh --ignore-source

      - name: Extract target firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh --ignore-target

      # 7. عملية بناء الروم
      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          if [ "${{ inputs.build_zip }}" = "true" ]; then
              ./scripts/make_rom.sh
          else
              ./scripts/make_rom.sh --no-rom-zip
          fi

      # 8. الرفع إلى PixelDrain
      - name: Upload to PixelDrain
        if: inputs.build_zip == true
        run: |
          ZIP_FILE=$(find out -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No ZIP file found in out/ directory!"
            exit 1
          fi
          
          echo "Uploading $ZIP_FILE to PixelDrain..."
          RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.PIXELDRAIN_API_KEY }}" -T "$ZIP_FILE" https://pixeldrain.com/api/file)
          FILE_ID=$(echo "$RESPONSE" | jq -r '.id')
          
          if [ "$FILE_ID" != "null" ] && [ -n "$FILE_ID" ]; then
            echo "=========================================="
            echo "Download Link: https://pixeldrain.com/u/$FILE_ID"
            echo "=========================================="
          else
            echo "Failed to upload file. Server Response:"
            echo "$RESPONSE"
            exit 1
          fi
